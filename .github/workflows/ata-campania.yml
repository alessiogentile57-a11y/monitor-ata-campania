
name: ATA Campania - Solo interpelli attivi

on:
  schedule:
    - cron: '38 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Funzione da eseguire'
        default: monitor
        options:
          - chat-id
          - test
          - monitor

permissions:
  contents: write

concurrency:
  group: ata-campania-serial
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installa dipendenze
        run: python -m pip install -q -r requirements.txt

      - name: Ricerca / Prova
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: python monitor.py --mode "$RUN_MODE"

      - name: Salva storico e resoconto
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'monitor')
        run: |
          git config user.name 'ata-campania-bot'
          git config user.email 'ata-campania-bot@users.noreply.github.com'
          git add data/state.json data/last_run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna controlli ATA Campania [skip ci]'
            git push
          fi
